name: Sunny Side Up

on:
  issues:
    types: [opened]

# One launch at a time, so two players never overwrite each other's board.
concurrency:
  group: sunny-side-up
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  launch:
    if: startsWith(github.event.issue.title, 'sunnyside:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RESULT_FILE: ${{ runner.temp }}/result.md
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the launch and redraw the board
        env:
          TITLE: ${{ github.event.issue.title }}
          PLAYER: ${{ github.event.issue.user.login }}
        run: node game/play.mjs

      - name: Commit the new board
        env:
          PLAYER: ${{ github.event.issue.user.login }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md game
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "🍳 @${PLAYER} launched Sunny Side"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      # Comment first, then close, so the player always gets a reply even if the issue is already closed.
      - name: Reply with the result
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RESULT_FILE"
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" || true
